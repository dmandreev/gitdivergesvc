name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x64
            binary: gitdiverge
            archive: tar.gz
          - os: windows-latest
            suffix: windows-x64
            binary: gitdiverge.exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webclientsrc/package-lock.json

      - name: Build web client
        shell: bash
        run: |
          cd webclientsrc
          npm ci
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build extreme profile
        run: cargo build --profile extreme

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp "target/extreme/${{ matrix.binary }}" dist/
          cp LICENSE README.md gitdiverge.toml.example dist/
          chmod +x "dist/${{ matrix.binary }}"
          tar czf "gitdiverge-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz" -C dist .

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/extreme/${{ matrix.binary }}" dist/
          Copy-Item LICENSE dist/
          Copy-Item README.md dist/
          Copy-Item gitdiverge.toml.example dist/
          Compress-Archive -Path dist/* -DestinationPath "gitdiverge-${{ github.ref_name }}-${{ matrix.suffix }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitdiverge-${{ github.ref_name }}-${{ matrix.suffix }}
          path: gitdiverge-${{ github.ref_name }}-${{ matrix.suffix }}.${{ matrix.archive }}
          if-no-files-found: error

  checksum:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum gitdiverge-* > checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/checksums.txt

  release:
    name: Create GitHub Release
    needs: [build, checksum]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
